[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-resource-owner-dashboard"
description = "Read-only dashboard: who has what running in a shared AWS course account"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["boto3==1.43.109", "botocore==1.43.109"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pre-commit==4.6.2"]

[tool.setuptools.dynamic]
version = { attr = "dashboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]  # ruff format also formats code blocks in Markdown; keep the docs as written

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "D205", "D209"]  # D: PEP 257 docstring layout
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
