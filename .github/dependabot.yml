version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # boto3 requires the botocore of the same release, and both are pinned exactly.
      boto:
        patterns:
          - boto3
          - botocore
    ignore:
      # botocore requires python-dateutil<3.0.0; remove this once a botocore release allows 3.x.
      - dependency-name: python-dateutil
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
