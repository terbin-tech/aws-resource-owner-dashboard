# No AWS access, by design: an admin deploys from their own machine (see the README),
# so CI has no OIDC role, no id-token permission and no AWS secrets or variables.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install checkov==3.4.2
          echo "$RUNNER_TEMP/checkov/bin" >> "$GITHUB_PATH"
      - name: pre-commit, manual stage (every hook but the local denylist ones, plus tflint and checkov)
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the aws ruleset
        run: pre-commit run --all-files --show-diff-on-failure --hook-stage manual
      - name: pytest
        run: pytest
