default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-denylist
        name: private terms (.denylist)
        entry: python scripts/check_denylist.py
        language: system
        types: [text]
        stages: [pre-commit]
      - id: check-denylist-msg
        name: private terms in the commit message (.denylist)
        entry: python scripts/check_denylist.py
        language: system
        stages: [commit-msg]
